<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harmonium Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1512;
            color: #f3e5d8;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            touch-action: manipulation; /* Prevent zoom on double tap */
        }

        h1 {
            font-family: 'Cinzel', serif;
        }

        /* Harmonium Wooden Body Texture */
        .wood-body {
            background: linear-gradient(to bottom, #4a2e15, #311c0c);
            background-image: 
                linear-gradient(to bottom, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.2) 100%),
                repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(0,0,0,0.05) 50px, rgba(0,0,0,0.05) 100px);
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.8),
                0 15px 30px rgba(0,0,0,0.6);
            border: 4px solid #241408;
            border-bottom: 8px solid #1a0f06;
        }

        /* Keyboard Layout */
        #keyboard-container {
            position: relative;
            display: flex;
            width: 100%;
            max-width: 1000px;
            height: 220px;
            margin: 0 auto;
            background: #111;
            padding: 4px 4px 0 4px;
            border-radius: 4px;
            border: 2px solid #000;
            box-shadow: inset 0 10px 15px rgba(0,0,0,0.5);
            user-select: none;
            -webkit-user-select: none;
        }

        .key-white {
            flex: 1;
            position: relative;
            background: linear-gradient(to bottom, #fffff8 0%, #e0ded0 100%);
            border: 1px solid #999;
            border-radius: 0 0 4px 4px;
            margin: 0 1px;
            z-index: 1;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.2), 0 2px 2px rgba(0,0,0,0.4);
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 15px;
            color: #777;
            font-size: 0.75rem;
            transition: background 0.1s;
        }

        .key-white.active {
            background: linear-gradient(to bottom, #e0ded0 0%, #c4c2b5 100%);
            box-shadow: inset 0 -1px 2px rgba(0,0,0,0.2), 0 0px 1px rgba(0,0,0,0.4);
            transform: translateY(2px);
        }

        .key-black {
            position: absolute;
            top: 0;
            right: -30%;
            width: 60%;
            height: 65%;
            background: linear-gradient(to bottom, #222 0%, #000 100%);
            border: 1px solid #000;
            border-radius: 0 0 3px 3px;
            z-index: 2;
            box-shadow: inset 0 -3px 5px rgba(255,255,255,0.2), 0 3px 5px rgba(0,0,0,0.5);
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            color: #555;
            font-size: 0.7rem;
            transition: background 0.1s;
        }

        .key-black.active {
            background: linear-gradient(to bottom, #111 0%, #222 100%);
            box-shadow: inset 0 -1px 2px rgba(255,255,255,0.1), 0 1px 2px rgba(0,0,0,0.5);
            transform: translateY(2px);
        }

        /* Drone Toggle Buttons */
        .drone-btn {
            background: linear-gradient(to bottom, #d4af37, #aa8122); /* Brass/Gold look */
            color: #3e2723;
            border: 2px solid #5c4018;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.4);
            transition: all 0.2s ease;
        }
        .drone-btn.active {
            background: linear-gradient(to bottom, #8a6616, #d4af37);
            box-shadow: 0 1px 2px rgba(0,0,0,0.5), inset 0 3px 6px rgba(0,0,0,0.6);
            transform: translateY(2px);
            color: #1a0f06;
        }

        /* Overlay */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 10, 5, 0.9);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        /* Mobile specific adjustments */
        @media (max-width: 768px) {
            #keyboard-container {
                height: 180px;
            }
            .key-label {
                display: none; /* Hide key mappings on mobile to keep it clean */
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Start Overlay (Required to unlock Web Audio API) -->
    <div id="start-overlay">
        <h1 class="text-4xl md:text-5xl font-bold text-[#d4af37] mb-6 tracking-wider text-center">Harmonium</h1>
        <p class="text-gray-300 mb-8 max-w-md text-center px-4">Experience the rich, resonant sounds of a traditional Indian reed organ. Click below to initialize the audio engine.</p>
        <button id="start-btn" class="drone-btn px-8 py-4 rounded-full text-xl font-bold tracking-widest uppercase">
            Start Playing
        </button>
    </div>

    <!-- Main Application Container -->
    <main class="wood-body w-full max-w-5xl rounded-xl p-4 md:p-8 flex flex-col gap-6 relative hidden" id="app-container">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center border-b border-[#311c0c] pb-4 mb-2">
            <div class="text-center md:text-left mb-4 md:mb-0">
                <h1 class="text-3xl text-[#d4af37] tracking-widest uppercase">Harmonium</h1>
                <p class="text-xs text-[#a07b5a] tracking-wider mt-1">Virtual Reed Organ</p>
            </div>
            
            <!-- Controls (Drones & Volume) -->
            <div class="flex items-center gap-6 bg-[#2a1a0f] p-3 rounded-lg border border-[#1a0f06] shadow-inner">
                <div class="flex flex-col items-center">
                    <span class="text-xs text-[#a07b5a] uppercase tracking-wider mb-2 font-semibold">Drones (Stops)</span>
                    <div class="flex gap-3">
                        <button id="drone-c" class="drone-btn w-12 h-12 rounded-full font-bold flex items-center justify-center text-sm" data-note="C3">
                            Sa<br><span class="text-[0.6rem] block">(C)</span>
                        </button>
                        <button id="drone-g" class="drone-btn w-12 h-12 rounded-full font-bold flex items-center justify-center text-sm" data-note="G3">
                            Pa<br><span class="text-[0.6rem] block">(G)</span>
                        </button>
                    </div>
                </div>

                <div class="h-12 w-px bg-[#4a2e15] mx-2"></div>

                <div class="flex flex-col items-center w-32">
                    <label for="master-volume" class="text-xs text-[#a07b5a] uppercase tracking-wider mb-2 font-semibold">Master Vol</label>
                    <input type="range" id="master-volume" min="0" max="1" step="0.01" value="0.7" class="w-full accent-[#d4af37] bg-[#1a0f06] rounded-lg appearance-none h-2 cursor-pointer">
                </div>
            </div>
        </header>

        <!-- Keyboard Area -->
        <div class="w-full overflow-x-auto overflow-y-hidden pb-4 custom-scrollbar">
            <div id="keyboard-container">
                <!-- Keys will be injected here via JavaScript -->
            </div>
        </div>

        <footer class="text-center text-[#7a583e] text-xs mt-2">
            Play using your mouse, touch screen, or standard QWERTY computer keyboard.
        </footer>
    </main>

    <script>
        // Note Data: 2 Octaves from C3 to C5
        // Standard keyboard mapping: 
        // Lower Octave: Z X C V B N M (White) | S D G H J (Black)
        // Upper Octave: Q W E R T Y U I (White) | 2 3 5 6 7 (Black)
        const notesData = [
            { note: 'C3', freq: 130.81, key: 'Z', isBlack: false },
            { note: 'C#3', freq: 138.59, key: 'S', isBlack: true },
            { note: 'D3', freq: 146.83, key: 'X', isBlack: false },
            { note: 'D#3', freq: 155.56, key: 'D', isBlack: true },
            { note: 'E3', freq: 164.81, key: 'C', isBlack: false },
            { note: 'F3', freq: 174.61, key: 'V', isBlack: false },
            { note: 'F#3', freq: 185.00, key: 'G', isBlack: true },
            { note: 'G3', freq: 196.00, key: 'B', isBlack: false },
            { note: 'G#3', freq: 207.65, key: 'H', isBlack: true },
            { note: 'A3', freq: 220.00, key: 'N', isBlack: false },
            { note: 'A#3', freq: 233.08, key: 'J', isBlack: true },
            { note: 'B3', freq: 246.94, key: 'M', isBlack: false },
            { note: 'C4', freq: 261.63, key: 'Q', isBlack: false },
            { note: 'C#4', freq: 277.18, key: '2', isBlack: true },
            { note: 'D4', freq: 293.66, key: 'W', isBlack: false },
            { note: 'D#4', freq: 311.13, key: '3', isBlack: true },
            { note: 'E4', freq: 329.63, key: 'E', isBlack: false },
            { note: 'F4', freq: 349.23, key: 'R', isBlack: false },
            { note: 'F#4', freq: 369.99, key: '5', isBlack: true },
            { note: 'G4', freq: 392.00, key: 'T', isBlack: false },
            { note: 'G#4', freq: 415.30, key: '6', isBlack: true },
            { note: 'A4', freq: 440.00, key: 'Y', isBlack: false },
            { note: 'A#4', freq: 466.16, key: '7', isBlack: true },
            { note: 'B4', freq: 493.88, key: 'U', isBlack: false },
            { note: 'C5', freq: 523.25, key: 'I', isBlack: false }
        ];

        // Global State
        let audioContext;
        let masterGainNode;
        const activeNotes = new Map(); // Tracks actively playing synth nodes
        const activeDrones = new Map();
        let isMouseDown = false;

        // UI Elements
        const overlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');
        const appContainer = document.getElementById('app-container');
        const keyboardContainer = document.getElementById('keyboard-container');
        const masterVolumeControl = document.getElementById('master-volume');

        class HarmoniumVoice {
            constructor(ctx, frequency, destination) {
                this.ctx = ctx;
                
                // Three oscillators to create the rich reed sound
                this.osc1 = ctx.createOscillator(); // Main body
                this.osc2 = ctx.createOscillator(); // Beating/Chorus
                this.osc3 = ctx.createOscillator(); // Sub-octave warmth

                this.filter = ctx.createBiquadFilter();
                this.gain = ctx.createGain();

                // Sawtooth and square waves are ideal for reed organs
                this.osc1.type = 'sawtooth';
                this.osc2.type = 'square';
                this.osc3.type = 'sawtooth';

                // Detuning creates the characteristic harmonium "shimmer" or chorus
                this.osc2.detune.value = 10;
                this.osc3.detune.value = -8;

                // Set frequencies
                this.osc1.frequency.value = frequency;
                this.osc2.frequency.value = frequency;
                this.osc3.frequency.value = frequency / 2; // Octave below

                // Filter to tame harsh highs, mapping cutoff to base frequency
                this.filter.type = 'lowpass';
                // Cutoff frequency scales with pitch but caps around 3500Hz
                this.filter.frequency.value = Math.min(frequency * 5, 3500); 
                this.filter.Q.value = 1.2;

                // Adjust individual oscillator volumes before the main gain
                const mix1 = ctx.createGain(); mix1.gain.value = 0.5;
                const mix2 = ctx.createGain(); mix2.gain.value = 0.3;
                const mix3 = ctx.createGain(); mix3.gain.value = 0.2;

                // Routing
                this.osc1.connect(mix1);
                this.osc2.connect(mix2);
                this.osc3.connect(mix3);
                
                mix1.connect(this.filter);
                mix2.connect(this.filter);
                mix3.connect(this.filter);

                this.filter.connect(this.gain);
                this.gain.connect(destination);

                // Initial silent gain
                this.gain.gain.value = 0;
            }

            start() {
                const now = this.ctx.currentTime;
                this.osc1.start(now);
                this.osc2.start(now);
                this.osc3.start(now);

                // ADSR Envelope
                // Harmoniums have a slight attack time as air fills the reed chamber
                this.gain.gain.cancelScheduledValues(now);
                this.gain.gain.setValueAtTime(0, now);
                this.gain.gain.linearRampToValueAtTime(0.5, now + 0.08); // Attack
                this.gain.gain.exponentialRampToValueAtTime(0.4, now + 0.2); // Decay to Sustain
            }

            stop() {
                const now = this.ctx.currentTime;
                this.gain.gain.cancelScheduledValues(now);
                this.gain.gain.setValueAtTime(this.gain.gain.value, now);
                // Release - reeds fade quickly but not instantly
                this.gain.gain.linearRampToValueAtTime(0.001, now + 0.25); 
                
                // Stop oscillators slightly after release finishes to avoid clicks
                this.osc1.stop(now + 0.3);
                this.osc2.stop(now + 0.3);
                this.osc3.stop(now + 0.3);
            }
        }

        function renderKeyboard() {
            keyboardContainer.innerHTML = '';
            
            // We'll process notes sequentially. 
            // A white key is a container. If the *next* note is black, 
            // it's appended as a child to the current white key.
            for (let i = 0; i < notesData.length; i++) {
                const note = notesData[i];
                
                if (!note.isBlack) {
                    const whiteKey = document.createElement('div');
                    whiteKey.className = 'key-white';
                    whiteKey.dataset.note = note.note;
                    whiteKey.innerHTML = `<span class="key-label">${note.key}</span>`;
                    
                    // Check if next note exists and is black
                    if (i + 1 < notesData.length && notesData[i + 1].isBlack) {
                        const blackNote = notesData[i + 1];
                        const blackKey = document.createElement('div');
                        blackKey.className = 'key-black';
                        blackKey.dataset.note = blackNote.note;
                        blackKey.innerHTML = `<span class="key-label">${blackNote.key}</span>`;
                        
                        // Add events to black key
                        attachKeyEvents(blackKey, blackNote);
                        whiteKey.appendChild(blackKey);
                    }
                    
                    // Add events to white key
                    attachKeyEvents(whiteKey, note);
                    keyboardContainer.appendChild(whiteKey);
                }
            }
        }

        function attachKeyEvents(element, noteData) {
            // Stop event propagation on black keys so it doesn't trigger the underlying white key
            
            // Mouse Events
            element.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                isMouseDown = true;
                playNote(noteData.note, element);
            });

            element.addEventListener('mouseenter', (e) => {
                e.stopPropagation();
                if (isMouseDown) {
                    playNote(noteData.note, element);
                }
            });

            element.addEventListener('mouseleave', (e) => {
                e.stopPropagation();
                releaseNote(noteData.note, element);
            });

            element.addEventListener('mouseup', (e) => {
                e.stopPropagation();
                releaseNote(noteData.note, element);
            });

            // Touch Events
            element.addEventListener('touchstart', (e) => {
                e.preventDefault(); // Prevent scrolling/zooming
                e.stopPropagation();
                playNote(noteData.note, element);
            });

            element.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
                releaseNote(noteData.note, element);
            });
            
            element.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                e.stopPropagation();
                releaseNote(noteData.note, element);
            });
        }

        // Global mouse up to catch when dragged out of the whole keyboard area
        document.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        function playNote(noteName, domElement = null) {
            if (!audioContext) return;
            if (activeNotes.has(noteName)) return; // Note already playing

            const noteData = notesData.find(n => n.note === noteName);
            if (!noteData) return;

            // Visual feedback
            if (!domElement) {
                // Find DOM element if triggered via PC Keyboard
                const allKeys = document.querySelectorAll('.key-white, .key-black');
                domElement = Array.from(allKeys).find(el => el.dataset.note === noteName);
            }
            if (domElement) domElement.classList.add('active');

            // Audio Synthesis
            const voice = new HarmoniumVoice(audioContext, noteData.freq, masterGainNode);
            voice.start();
            activeNotes.set(noteName, voice);
        }

        function releaseNote(noteName, domElement = null) {
            if (!audioContext) return;
            if (!activeNotes.has(noteName)) return; // Note not playing

            // Visual feedback
            if (!domElement) {
                const allKeys = document.querySelectorAll('.key-white, .key-black');
                domElement = Array.from(allKeys).find(el => el.dataset.note === noteName);
            }
            if (domElement) domElement.classList.remove('active');

            // Audio Synthesis
            const voice = activeNotes.get(noteName);
            voice.stop();
            activeNotes.delete(noteName);
        }

        document.addEventListener('keydown', (e) => {
            if (e.repeat) return; // Ignore key hold repeating
            const keyChar = e.key.toUpperCase();
            const noteData = notesData.find(n => n.key === keyChar);
            if (noteData) {
                playNote(noteData.note);
            }
        });

        document.addEventListener('keyup', (e) => {
            const keyChar = e.key.toUpperCase();
            const noteData = notesData.find(n => n.key === keyChar);
            if (noteData) {
                releaseNote(noteData.note);
            }
        });

        function toggleDrone(noteName, btnElement) {
            if (!audioContext) return;
            
            if (activeDrones.has(noteName)) {
                // Turn off
                const voice = activeDrones.get(noteName);
                voice.stop();
                activeDrones.delete(noteName);
                btnElement.classList.remove('active');
            } else {
                // Turn on
                const noteData = notesData.find(n => n.note === noteName);
                // Drones play slightly quieter so they don't overpower the melody
                const droneGain = audioContext.createGain();
                droneGain.gain.value = 0.6;
                droneGain.connect(masterGainNode);
                
                const voice = new HarmoniumVoice(audioContext, noteData.freq, droneGain);
                voice.start();
                activeDrones.set(noteName, voice);
                btnElement.classList.add('active');
            }
        }

        document.getElementById('drone-c').addEventListener('click', function() {
            toggleDrone('C3', this);
        });

        document.getElementById('drone-g').addEventListener('click', function() {
            toggleDrone('G3', this);
        });

        // Volume Control
        masterVolumeControl.addEventListener('input', (e) => {
            if (masterGainNode) {
                // Audio parameters should be smoothed, but for simplicity linear mapping here works fine
                masterGainNode.gain.setValueAtTime(parseFloat(e.target.value), audioContext.currentTime);
            }
        });

        // Bootstrapping the Application
        function initAudio() {
            // Standard AudioContext implementation
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioContext();
            
            // Setup Master Gain
            masterGainNode = audioContext.createGain();
            masterGainNode.gain.value = parseFloat(masterVolumeControl.value);
            masterGainNode.connect(audioContext.destination);

            // Resume context if suspended (browser policy)
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            // Hide overlay, show app
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                appContainer.classList.remove('hidden');
                renderKeyboard();
            }, 500);
        }

        startBtn.addEventListener('click', initAudio);

    </script>
</body>
</html>
